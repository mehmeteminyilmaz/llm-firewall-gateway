services:
  gateway:
    build: .
    container_name: llm-guardrail-gateway
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - guardrail_data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/llmops.db
      - HOST=0.0.0.0
      - PORT=8000

  dashboard:
    build: .
    container_name: llm-guardrail-dashboard
    command: python -m streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - guardrail_data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/llmops.db
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway

volumes:
  guardrail_data:
