name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Embedding model önbelleği (fastembed)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-minilm-v1-${{ runner.os }}

      - name: Bağımlılıkları yükle ve modelleri ısıt
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -c "from fastembed import TextEmbedding; list(TextEmbedding('sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2').embed(['warmup']))"

      - name: Birim, entegrasyon ve güvenlik regresyon testleri
        run: pytest -q

      - name: Akademik benchmark ve kalite kapısı (F1 >= 92, Holdout F1 >= 80, P95 gecikme SLA)
        run: python benchmark.py

      - name: Benchmark raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            BENCHMARK_REPORT.md
            benchmarks/latest_results.json
